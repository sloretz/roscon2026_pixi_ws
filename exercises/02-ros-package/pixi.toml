# Exercise 2: starting point.
#
# This is where Exercise 1 left off, trimmed to Lyrical: ROS 2 from RoboStack,
# and our own C++ node in src/turtle_dancer built by colcon. Running it means
# `pixi run build` once before the first launch so activation can find the
# overlay. The Python package is left for the second half of this exercise.
#
# Your job: hand the build to Pixi, then delete everything colcon needed.
#
# Instructions: https://prefix-dev.github.io/roscon-2026-declarative-ros-workspaces-with-pixi/exercises/02-ros-package/

[workspace]
name = "02-ros-package"
channels = ["https://prefix.dev/robostack-lyrical", "conda-forge"]
platforms = [
  "linux-64",
  # Requires macOS 14 to be able to install MoltonVK in the build environments
  { platform = "osx-arm64", macos = "14.0" },
  "win-64",
]
preview = ["pixi-build"]

[workspace.dependencies]
pixi-build-ros = ">=0.7.5"

[dependencies]
ros-lyrical-ros-base = ">=0.11"
ros-lyrical-turtlesim = ">=1.8"
ros-lyrical-turtle-dancer = {path = "src/turtle_dancer/package.xml"}
ros-lyrical-turtle-choreographer = {path = "src/turtle_choreographer/package.xml"}

# pixi add --path src/downloaded_ros_packages (needs per package pixi.toml, nothing that adds package.xml stuff here)
#  Maybe could Pr a feature request for --backend pixi-build-ros
# Rueben Arts has separate tool: pixi-ros init ( can reinitialize if src/ changes - adds it to "dev dependencies")

[tasks]
sim = "ros2 run turtlesim turtlesim_node"
teleop = "ros2 run turtlesim turtle_teleop_key"
topics = "ros2 topic list"
dance = { cmd = "ros2 run turtle_dancer dance"}
choreograph = "ros2 run turtle_choreographer choreograph"

